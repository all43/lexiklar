name = "lexiklar-admin"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "admin.lexiklar.app", custom_domain = true }
]

[vars]
GITHUB_REPO = "all43/lexiklar"
GITHUB_BRANCH = "main"

[[r2_buckets]]
binding = "R2"
bucket_name = "lexiklar-admin"

[site]
bucket = "../dist"
